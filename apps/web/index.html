<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HourTrack" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>HourTrack</title>
    <!--
      Google Identity Services SDK. Loaded ahead of the app entry so the
      `google.accounts.oauth2.*` namespace is reliably defined by the time
      `LoginPage` starts the GIS token flow (`initTokenClient`). The script is
      hosted on Google's domain and not bundled with the app.
    -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
