name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking gate: fail the build on a high/critical advisory in a RUNTIME
      # dependency. `--prod` scopes out dev/build tooling so a vitest/vite/etc.
      # advisory (which never ships to users) doesn't red-wall every PR — those
      # are caught by the informational full-tree audit below and triaged via
      # Renovate/Dependabot. See docs/DEPENDENCY_POLICY.md.
      - name: Security audit (runtime, blocking)
        run: pnpm audit --prod --audit-level=high

      # Informational: full-tree audit incl. devDependencies. Never blocks the
      # build (dev-tool advisories are low-exposure) but surfaces the count in
      # the logs so the dev-tooling debt stays visible.
      - name: Security audit (full tree, informational)
        run: pnpm audit || true

      - name: i18n parity check
        run: pnpm i18n:check

      # S29 Task 22 — format gate. lint-staged runs prettier on commit but is
      # bypassable with `git commit --no-verify`, so CI re-checks formatting.
      - name: Format check
        run: pnpm format:check

      - name: Turbo pipeline
        run: pnpm -w turbo run lint typecheck test build
        env:
          TURBO_TELEMETRY_DISABLED: 1

      # S29 Task 21 — real coverage with thresholds scoped to the data-integrity
      # core (see apps/web/vitest.config.ts). Runs after the turbo pipeline so a
      # plain unit-test failure surfaces first.
      - name: Coverage (data-integrity core thresholds)
        run: pnpm -F @hourtrack/web test:coverage

  # S29 Task 18 — E2E (Playwright) runs on every push/PR to main, parallel to
  # the unit/lint/build job. The config is already CI-ready (forbidOnly,
  # retries: 1, html reporter under CI).
  #
  # S32: CI runs the `chromium` project ONLY. The install step below has always
  # fetched chromium alone, while `pnpm e2e` ran every project — so the
  # webkit-based `mobile-iphone-13` project failed to launch on every single
  # run ("Executable doesn't exist ... webkit-2311") and its results were pure
  # noise. Note the trade-off: spec 08 is the mobile-drag regression suite and
  # exists because that path broke once, so that guard now lives in local runs
  # (`pnpm -F web e2e --project=mobile-iphone-13`) rather than CI. To put it
  # back, add `webkit` to the install step below — it roughly doubles this job.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @hourtrack/web exec playwright install --with-deps chromium

      # Only the `chromium` project — the install step above deliberately
      # fetches that browser alone. `pnpm e2e` with no filter also runs the
      # `mobile-iphone-13` project, which is webkit-based, so every mobile
      # test died on "Executable doesn't exist ... webkit". Run mobile
      # locally (`pnpm -F web e2e --project=mobile-iphone-13`); adding webkit
      # here roughly doubles the job and is a separate decision.
      - name: Run E2E
        run: pnpm --filter @hourtrack/web exec playwright test --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
